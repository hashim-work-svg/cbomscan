name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Static Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify Dependencies
        run: |
          go mod verify

      - name: Run Go Vet
        run: |
          go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Run Tests with Race Detector
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test Coverage Check
        run: |
          go tool cover -func=coverage.out

      - name: Static Binary Build (CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/cbomscan-linux-amd64 ./cmd/cbomscan
          chmod +x dist/cbomscan-linux-amd64

      - name: Verify Linux Static Linking
        run: |
          file dist/cbomscan-linux-amd64 | grep "statically linked"
          dist/cbomscan-linux-amd64 version

      - name: Run Go Vulnerability Check
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
